button.on{background:var(--a);color:#111;border-color:var(--a)}
button#ign{padding:10px 16px;font-weight:700;border-radius:20px}
#tg{grid-column:1/3;display:flex;gap:4px;flex-wrap:wrap}
#ctl{display:grid;grid-template-columns:auto 130px;gap:5px 8px;align-items:center}
#lib{max-width:200px}#gears{display:flex;gap:3px;flex-wrap:wrap;max-width:260px}#gears button{min-width:28px;padding:5px 6px}
